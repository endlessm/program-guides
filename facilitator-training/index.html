<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Facilitator Training - Endless Access</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{ --dark:#2F2D3C; --orange:#FF6B00; --bg:#F7F9FC; --line:#E6E9F0; --muted:#6B6F80; --soft:#F3F5F9; }
  *{ box-sizing:border-box; }
  body{ margin:0; padding:24px; background:var(--bg); font-family:'Inter',Arial,sans-serif; color:var(--dark); }
  .wrap{ max-width:720px; margin:0 auto; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:24px; overflow:hidden; }
  .worldband{ line-height:0; }
  .worldband img{ display:block; width:100%; height:120px; object-fit:cover; object-position:center 42%; }
  .hero{ background:var(--dark); padding:26px 32px 28px; text-align:center; }
  .hero img.logo{ width:150px; height:auto; display:block; margin:0 auto 14px; }
  .hero .kicker{ font-family:'Figtree'; color:var(--orange); font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase; margin:0 0 6px; }
  .hero h1{ font-family:'Figtree'; color:#fff; font-size:26px; margin:0 0 8px; font-weight:800; }
  .hero p{ color:#C9CCD8; font-size:15px; margin:0; }
  .body{ padding:28px 32px 34px; }
  .step{ font-family:'Figtree'; font-weight:700; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
  .progs{ display:flex; gap:12px; flex-wrap:wrap; }
  .prog{ flex:1 1 180px; border:2px solid var(--line); border-radius:16px; padding:16px 18px; cursor:pointer; background:#fff; text-align:left; font-family:'Figtree'; transition:all .15s; }
  .prog:hover{ border-color:#FFB37A; }
  .prog.active{ border-color:var(--orange); background:#FFF6EF; }
  .prog .pt{ font-weight:700; font-size:16px; color:var(--dark); }
  .prog .ps{ font-size:12px; color:var(--muted); margin-top:3px; }
  .panel{ margin-top:30px; }
  .prog-count{ font-size:13px; color:var(--muted); font-family:'Figtree'; font-weight:600; margin-bottom:10px; }
  .bar{ height:8px; background:var(--soft); border-radius:99px; overflow:hidden; margin:0 0 18px; }
  .bar span{ display:block; height:100%; width:0; background:var(--orange); transition:width .3s; }
  .videos{ position:relative; }
  .vid{ display:flex; padding-bottom:10px; }
  .gutter{ width:40px; flex:none; position:relative; }
  .gutter .rail{ position:absolute; left:50%; transform:translateX(-50%); width:2px; background:var(--line); top:0; bottom:0; z-index:1; }
  .vid:first-child .gutter .rail{ top:25px; }
  .vid:last-child .gutter .rail{ bottom:auto; height:25px; }
  .gutter .dot{ position:absolute; top:17px; left:50%; transform:translateX(-50%); width:16px; height:16px; border-radius:50%; border:2px solid var(--line); background:#fff; z-index:2; cursor:pointer; transition:all .2s; }
  .vid.done .gutter .dot{ background:var(--orange); border-color:var(--orange); }
  .vid.done .gutter .dot::after{ content:'\u2713'; position:absolute; inset:-1px; display:flex; align-items:center; justify-content:center; color:#fff; font-size:10px; font-weight:700; }
  .vcontent{ flex:1; min-width:0; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .vid.done .vcontent{ border-color:#FFD9BE; background:#FFFBF7; }
  .vrow{ display:flex; align-items:center; gap:10px; padding:12px 14px; flex-wrap:wrap; }
  .vtitle{ flex:1 1 150px; min-width:0; font-size:15px; font-weight:500; }
  .vtitle em{ font-style:italic; }
  .vdur{ flex:none; font-size:12px; color:var(--muted); font-family:'Courier New',monospace; }
  .vwatch{ flex:none; background:var(--orange); color:#fff; font-family:'Figtree'; font-weight:600; font-size:13px; padding:8px 16px; border-radius:99px; border:none; cursor:pointer; }
  .vwatch.again{ background:#fff; color:var(--orange); border:1px solid var(--orange); }
  .vreflect{ flex:none; background:var(--dark); color:#fff; border:none; font-family:'Figtree'; font-weight:600; font-size:13px; padding:8px 16px; border-radius:99px; text-decoration:none; }
  .vreflect:hover{ opacity:.9; }
  .player{ display:none; padding:0 14px 14px; }
  .player.open{ display:block; }
  .player .frame{ position:relative; padding-bottom:56.25%; height:0; border-radius:10px; overflow:hidden; background:#000; }
  .player iframe{ position:absolute; top:0; left:0; width:100%; height:100%; border:0; }
  .finish{ background:var(--dark); border-radius:18px; padding:24px 26px; text-align:center; margin-top:8px; }
  .finish h3{ font-family:'Figtree'; color:#fff; font-size:19px; margin:0 0 6px; font-weight:700; }
  .finish p{ color:#C9CCD8; font-size:14px; margin:0 0 16px; }
  .finish-btn{ display:inline-block; background:var(--orange); color:#fff; font-family:'Figtree'; font-weight:700; font-size:15px; padding:13px 28px; border-radius:99px; text-decoration:none; }
  .soon{ text-align:center; padding:36px 20px; color:var(--muted); }
  .soon .em{ font-size:34px; }
  .soon p{ font-size:15px; max-width:430px; margin:12px auto 0; }
  .pl-link{ display:inline-block; margin:6px 0 24px; font-family:'Figtree'; font-weight:600; font-size:13px; color:var(--orange); text-decoration:none; }
  em{ font-style:italic; }
  @media(max-width:520px){ .vdur{ display:none; } .body{ padding:22px 16px 28px; } .hero{ padding:22px 18px 24px; } .gutter{ width:32px; } }

.seg{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px Inter,sans-serif;padding:6px 14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--orange);color:#fff}
.seg button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.langbar{display:flex;justify-content:flex-end;padding:14px 20px 0}
</style>
</head>
<body>
<div class="wrap">

 "playlist": "PLPreEGKe1OCI", "videos": [{"title": "Who is Endless Access?", "id": "urEzL35f6Io", "dur": "4:45", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384326&ut=0"}, {"title": "The Endless Learning Model", "id": "jesOj7CbKqI", "dur": "4:11", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384327&ut=0"}, {"title": "What is Threadbare?", "id": "sqhOwVfE6b4", "dur": "3:23", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384328&ut=0"}, {"title": "Explore: Godot Explained", "id": "3gn41-unAWk", "dur": "4:49", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384330&ut=0"}, {"title": "Platform Tour", "id": "ygRkptf6YqE", "dur": "3:01", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384331&ut=0"}, {"title": "Session Anatomy for Explore: Godot", "id": "vNOu5ibNLrc", "dur": "4:57", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384333&ut=0"}, {"title": "Pedagogy in Practice", "id": "wLY7X_xAnqc", "dur": "3:20", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384334&ut=0"}, {"title": "Facilitating Skill Growth", "id": "3mWxJlJrFXw", "dur": "4:52", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384335&ut=0"}, {"title": "Explore: Godot Deep-Dive", "id": "cJd31Zhl1gs", "dur": "11:40", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384337&ut=0"}, {"title": "Godot Explainer", "id": "iWWWMMk0bbk", "dur": "7:17", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384338&ut=0"}, {"title": "What Mentors Really Do", "id": "S5OMYO33o1A", "dur": "3:42", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384339&ut=0"}, {"title": "Getting Support", "id": "PUexxfRh63c", "dur": "2:35", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384340&ut=0"}, {"title": "Wrap Up", "id": "z6tvB-98P_A", "dur": "4:41", "reflect": "https://studio.endlessstudios.com/programs/4043817/?progTab=Tasks&t=5384341&ut=0"}]}, "core-tb": {"name": "Core: Threadbare", "playlist": null, "videos": [], "note": "The Core: Threadbare training videos have not been created yet. They will appear here once they are ready."}};
const SUB = {en:{'explore-tb':'11 videos','explore-godot':'13 videos','core-tb':'Coming soon'},
             es:{'explore-tb':'11 videos','explore-godot':'13 videos','core-tb':'Próximamente'}};
const T = {
  en:{title:'Facilitator Training',
      lede:'Choose your program, then work through the videos in order',
      step1:'Step 1 &middot; Select your program',
      step2:'Step 2 &middot; Watch your videos',
      step3:'Step 3 &middot; Let us know you finished',
      ofComplete:(d,n)=>d+' of '+n+' complete',
      watch:'Watch', rewatch:'Rewatch', reflect:'Reflect',
      markDone:'Mark complete',
      playlist:'Open the full playlist on YouTube \u2197',
      finishH:'Done with your training?',
      finishP:'Once you have watched the videos and completed each reflection, let us know and we will send your certificate.',
      finishB:'Complete the form \u2192',
      soonCore:'The Core: Threadbare training videos have not been created yet. They will appear here once they are ready.',
      soon:'Coming soon.'},
  es:{title:'Capacitación para Facilitadores',
      lede:'Elige tu programa y luego avanza por los videos en orden',
      step1:'Paso 1 &middot; Elige tu programa',
      step2:'Paso 2 &middot; Mira tus videos',
      step3:'Paso 3 &middot; Avísanos que terminaste',
      ofComplete:(d,n)=>d+' de '+n+' completados',
      watch:'Ver', rewatch:'Ver de nuevo', reflect:'Reflexionar',
      markDone:'Marcar como completado',
      playlist:'Abrir la lista completa en YouTube \u2197',
      finishH:'¿Terminaste tu capacitación?',
      finishP:'Cuando hayas visto los videos y completado cada reflexión, avísanos y te enviaremos tu certificado.',
      finishB:'Completar el formulario \u2192',
      soonCore:'Los videos de capacitación de Core: Threadbare aún no se han creado. Aparecerán aquí cuando estén listos.',
      soon:'Próximamente.'}
};
const TITLE_ES = {
  'Who is Endless Access?':'¿Quiénes somos en Endless Access?',
  'The Endless Learning Model':'El Modelo de Aprendizaje de Endless',
  'What is Threadbare?':'¿Qué es Threadbare?',
  'Explore: Threadbare Explained':'Explore: Threadbare explicado',
  'Explore: Godot Explained':'Explore: Godot explicado',
  'Platform Tour':'Recorrido por la plataforma',
  'Session Anatomy for Explore: Threadbare':'Anatomía de una sesión de Explore: Threadbare',
  'Session Anatomy for Explore: Godot':'Anatomía de una sesión de Explore: Godot',
  'Pedagogy in Practice':'La pedagogía en la práctica',
  'Facilitating Skill Growth':'Facilitar el desarrollo de habilidades',
  'Explore: Threadbare Deep-Dive':'Explore: Threadbare en profundidad',
  'Explore: Godot Deep-Dive':'Explore: Godot en profundidad',
  'Godot Explainer':'Godot explicado',
  'What Mentors Really Do':'Qué hacen realmente los mentores',
  'Getting Support':'Cómo obtener ayuda',
  'Wrap Up':'Cierre'
};
const PLAYLIST_ES = 'PLLQKouhHTXwI';
const V = {
  intro:{id:'Zf3a850AEAQ', dur:'5:21', t:'Introducción: ¿Qué es Endless Access?'},
  m1:   {id:'ymymk4wA8lo', dur:'4:15', t:'Episodio 1: Modelo de Aprendizaje de Endless Access'},
  m2:   {id:'tCyxu5dNYzw', dur:'3:38', t:'Episodio 2: ¿Qué es Threadbare?'},
  m3a:  {id:'w82d1M4EK9A', dur:'5:31', t:'Episodio 3A: Explore: Threadbare Explicado'},
  m3b:  {id:'C_Cv_-JAfLE', dur:'6:13', t:'Episodio 3B: Explore: Godot Explicado'},
  m4:   {id:'x1yd_RJua9c', dur:'3:16', t:'Episodio 4: Recorrido por la Plataforma'},
  m5a:  {id:'QWtHXcNkTB0', dur:'7:04', t:'Episodio 5A: Anatomía de Sesión de Explore: Threadbare'},
  m5b:  {id:'hZihZswaHvI', dur:'6:06', t:'Episodio 5B: Anatomía de Sesión de Explore: Godot'},
  m6:   {id:'eDjH_789L8E', dur:'3:15', t:'Episodio 6: Pedagogía en la Práctica'},
  m7:   {id:'vWXGf4qJlFQ', dur:'4:15', t:'Episodio 7: XP, Entregables y Retroalimentación'},
  m8a:  {id:'--Re91V8oFc', dur:'17:11', t:'Episodio 8A: Análisis Profundo de Explore: Threadbare'},
  m8b:  {id:'mFZeB3N6Nn0', dur:'11:27', t:'Episodio 8B: Análisis Profundo de Explore: Godot'},
  m9:   {id:'JOQg22bM7OE', dur:'8:52', t:'Episodio 9: Explicación de Godot'},
  m10:  {id:'73XWxIzxWh4', dur:'3:57', t:'Episodio 10: El Objetivo de los Mentores'},
  m11:  {id:'Fu4NzMmZvqU', dur:'3:11', t:'Episodio 11: Obtener Apoyo'},
  m12:  {id:'5nzZ4fCF9z0', dur:'4:46', t:'Episodio 12: Cierre del Programa'}
};
// The Spanish program (Capacitacion para Facilitadores, id 5386716) has its own
// copy of the reflection tasks. Each Spanish video row links directly to the
// matching task in that program, by task id, slot for slot.
var ES_REFLECT = 'https://studio.endlessstudios.com/programs/5386716/?progTab=Tasks&t=';
function esTrack(keys, taskIds){
  return keys.map(function(k,i){
    return {title:V[k].t, id:V[k].id, dur:V[k].dur, reflect:ES_REFLECT + taskIds[i] + '&ut=0'};
  });
}
const VIDEOS_ES = {
  'explore-tb':    esTrack(['intro','m1','m2','m3a','m4','m5a','m6','m7','m8a','m11','m12'], [5386738,5386721,5386723,5386724,5386722,5386727,5386730,5386731,5386732,5386735,5386736]),
  'explore-godot': esTrack(['intro','m1','m2','m3b','m4','m5b','m6','m7','m8b','m9','m10','m11','m12'], [5386738,5386721,5386723,5386725,5386722,5386729,5386730,5386731,5386733,5386734,5386728,5386735,5386736]),
  'core-tb':       []
};
function vidsFor(key){
  var es = VIDEOS_ES[key];
  return (LANG==='es' && es && es.length) ? es : PROGRAMS[key].videos;
}
function playlistFor(key){
  var es = VIDEOS_ES[key];
  return (LANG==='es' && es && es.length) ? PLAYLIST_ES : PROGRAMS[key].playlist;
}
let LANG = (function(){
  try{ var u=new URL(location.href); var q=u.searchParams.get('lang'); if(q==='es'||q==='en') return q; }catch(e){}
  try{ var s=localStorage.getItem('ealang'); if(s==='es'||s==='en') return s; }catch(e){}
  return 'en';
})();
const t = k => T[LANG][k];
const FINISH_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSe15FXcDnJlfwFEIBuhKi6GSFHjHwcgSLfuAp3pLkPap8k-Uw/viewform';   // completion / certificate form
function fmtTitle(s){ var v=(LANG==='es' && TITLE_ES[s]) ? TITLE_ES[s] : s;
  return v.replace(/Threadbare/g,'<em>Threadbare</em>'); }
function storeKey(p){ return 'eatrain_'+p; }
function getDone(p){ try{ return JSON.parse(localStorage.getItem(storeKey(p))||'[]'); }catch(e){ return []; } }
function setDone(p,arr){ try{ localStorage.setItem(storeKey(p), JSON.stringify(arr)); }catch(e){} }

let CURRENT=null;
const progsEl = document.getElementById('progs');
Object.keys(PROGRAMS).forEach(key=>{
  const p = PROGRAMS[key];
  const b = document.createElement('button');
  b.className='prog'; b.dataset.key=key;
  b.innerHTML = '<div class="pt">'+fmtTitle(p.name)+'</div><div class="ps">'+SUB[LANG][key]+'</div>';
  b.onclick=()=>select(key);
  progsEl.appendChild(b);
});

function select(key){
  CURRENT=key;
  document.querySelectorAll('.prog').forEach(el=>el.classList.toggle('active', el.dataset.key===key));
  render(key);
}

function render(key){
  const p = PROGRAMS[key];
  const vids = vidsFor(key);
  const panel = document.getElementById('panel');
  let h = '<p class="step">'+t('step2')+'</p>';
  if(!vids || vids.length===0){
    h += '<div class="soon"><div class="em">\uD83E\uDDF5</div><p>'+ (p.videos?t('soonCore'):t('soon')) +'</p></div>';
    panel.innerHTML=h; return;
  }
  const done = getDone(key);
  h += '<div class="prog-count">'+t('ofComplete')('<span id="pc">'+done.length+'</span>', vids.length)+'</div>';
  h += '<div class="bar"><span id="barfill"></span></div>';
  h += '<div class="videos">';
  vids.forEach(v=>{
    const isDone = done.includes(v.id);
    h += '<div class="vid'+(isDone?' done':'')+'" data-id="'+v.id+'">'
      + '<div class="gutter"><div class="rail"></div><div class="dot" data-toggle="'+v.id+'" title="'+t('markDone')+'"></div></div>'
      + '<div class="vcontent">'
      +   '<div class="vrow">'
      +     '<div class="vtitle">'+fmtTitle(v.title)+'</div>'
      +     '<div class="vdur">'+v.dur+'</div>'
      +     '<button class="vwatch'+(isDone?' again':'')+'" data-vid="'+v.id+'">'+(isDone?t('rewatch'):t('watch'))+'</button>'
      +     '<a class="vreflect" href="'+v.reflect+'" target="_blank" rel="noopener">'+t('reflect')+'</a>'
      +   '</div>'
      +   '<div class="player" data-player="'+v.id+'"><div class="frame"></div></div>'
      + '</div>'
      + '</div>';
  });
  h += '</div>';
  h += '<a class="pl-link" href="https://www.youtube.com/playlist?list='+playlistFor(key)+'" target="_blank" rel="noopener">'+t('playlist')+'</a>';
  h += '<p class="step">'+t('step3')+'</p>';
  h += '<div class="finish"><h3>'+t('finishH')+'</h3><p>'+t('finishP')+'</p><a class="finish-btn" href="'+FINISH_URL+'" target="_blank" rel="noopener">'+t('finishB')+'</a></div>';
  panel.innerHTML = h;
  updateBar(key);

  panel.querySelectorAll('.vwatch').forEach(btn=>{ btn.onclick=()=>{ openPlayer(btn.dataset.vid, playlistFor(key)); markDone(key, btn.dataset.vid, true); }; });
  panel.querySelectorAll('.dot').forEach(dot=>{ dot.onclick=()=>{ const id=dot.dataset.toggle; const d=getDone(key); markDone(key, id, !d.includes(id)); }; });
}

function openPlayer(id, playlist){
  const pl = document.querySelector('.player[data-player="'+id+'"]');
  if(!pl) return;
  const open = pl.classList.contains('open');
  document.querySelectorAll('.player.open').forEach(o=>{ o.classList.remove('open'); o.querySelector('.frame').innerHTML=''; });
  if(!open){
    pl.querySelector('.frame').innerHTML = '<iframe src="https://www.youtube.com/embed/'+id+'?rel=0&list='+playlist+'" allow="accelerometer; autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>';
    pl.classList.add('open');
  }
}

function markDone(key, id, done){
  let d = getDone(key);
  if(done){ if(!d.includes(id)) d.push(id); } else { d = d.filter(x=>x!==id); }
  setDone(key,d);
  const row = document.querySelector('.vid[data-id="'+id+'"]');
  if(row){ row.classList.toggle('done', done); const w=row.querySelector('.vwatch'); if(w){ w.classList.toggle('again',done); w.textContent = done?t('rewatch'):t('watch'); } }
  updateBar(key);
}

function updateBar(key){
  const vids = vidsFor(key);
  const done = getDone(key).filter(id=>vids.some(v=>v.id===id));
  const pct = vids.length? Math.round(done.length/vids.length*100):0;
  const fill=document.getElementById('barfill'); if(fill) fill.style.width=pct+'%';
  const pc=document.getElementById('pc'); if(pc) pc.textContent=done.length;
}

function paintChrome(){
  var root=document.documentElement;
  root.setAttribute('data-lang',LANG); root.setAttribute('lang',LANG);
  document.getElementById('h-title').textContent = t('title');
  document.getElementById('h-lede').textContent  = t('lede');
  document.getElementById('step1').innerHTML     = t('step1');
  document.getElementById('lang-en').setAttribute('aria-pressed', LANG==='en'?'true':'false');
  document.getElementById('lang-es').setAttribute('aria-pressed', LANG==='es'?'true':'false');
  document.querySelectorAll('.prog').forEach(function(b){
    var k=b.dataset.key;
    b.innerHTML = '<div class="pt">'+fmtTitle(PROGRAMS[k].name)+'</div><div class="ps">'+SUB[LANG][k]+'</div>';
  });
}
function setLang(l){
  LANG=l;
  try{ localStorage.setItem('ealang',l); }catch(e){}
  try{ var u=new URL(location.href); u.searchParams.set('lang',l); history.replaceState(null,'',u); }catch(e){}
  paintChrome();
  if(CURRENT) render(CURRENT);
}
document.getElementById('lang-en').addEventListener('click',function(){ setLang('en'); });
document.getElementById('lang-es').addEventListener('click',function(){ setLang('es'); });
paintChrome();
select('explore-tb');
</script>
</body>
</html>
