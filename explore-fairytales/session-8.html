<style>
/* Explore: fAIrytales session, built on the Endless AI training-ground chassis.

:root{
  --bg:#ffffff; --paper:#ffffff; --paper-2:#f3f2f8; --field:#fbfbfe;
  --ink:#17161f; --ink-soft:#6b6880; --rule:#e6e4ef;

  --cinnamon:#2F2D3C; --cinnamon-ink:#ffffff; --brandgrey:#2F2D3C;
  --ok:#2e7d5b; --ok-soft:#e1efe7; --warn:#a9690f; --warn-soft:#f4e8cf; --bad:#bc3f2a; --bad-soft:#f6ded6;
  --shadow:0 1px 2px rgba(23,22,31,.06),0 1px 3px rgba(23,22,31,.05);
  --display:"Figtree",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif; --maxw:980px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141320; --paper:#1d1b2b; --paper-2:#262338; --field:#2b2840;
  --ink:#f2f1fa; --ink-soft:#a6a2bd; --rule:#332f49;
  --accent:#ff8a3d; --accent-ink:#1b1206; --accent-soft:#3a2615;
  --ginger:#ff8a3d; --ginger-ink:#1b1206;
  --cinnamon:#9b98ad; --cinnamon-ink:#160f2e; --brandgrey:#9b98ad;
  --ok:#53c493; --ok-soft:#1e2e28; --warn:#e2a64f; --warn-soft:#2e2619; --bad:#e2715c; --bad-soft:#2e1f1c;
  --shadow:0 1px 3px rgba(0,0,0,.5);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141320; --paper:#1d1b2b; --paper-2:#262338; --field:#2b2840;
  --ink:#f2f1fa; --ink-soft:#a6a2bd; --rule:#332f49;
  --accent:#ff8a3d; --accent-ink:#1b1206; --accent-soft:#3a2615;
  --ginger:#ff8a3d; --ginger-ink:#1b1206;
  --cinnamon:#9b98ad; --cinnamon-ink:#160f2e; --brandgrey:#9b98ad;
  --ok:#53c493; --ok-soft:#1e2e28; --warn:#e2a64f; --warn-soft:#2e2619; --bad:#e2715c; --bad-soft:#2e1f1c;
  --shadow:0 1px 3px rgba(0,0,0,.5);

}
[data-m=spark]{--m:#c76a00}[data-m=ask]{--m:#7c5cd6}[data-m=explain]{--m:#0a76ba}[data-m=feedback]{--m:#2e8540}[data-m=role]{--m:#c4087a}[data-m=teach]{--m:#0f8a85}[data-m=make]{--m:#ff6b00}
[data-m]{--m-ink:#ffffff;--m-soft:color-mix(in srgb,var(--m) 14%,var(--paper))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-m=spark]{--m:#f3a640}:root:not([data-theme="light"]) [data-m=ask]{--m:#a78bf0}:root:not([data-theme="light"]) [data-m=explain]{--m:#3ea7e6}:root:not([data-theme="light"]) [data-m=feedback]{--m:#6cc777}:root:not([data-theme="light"]) [data-m=role]{--m:#ef5bb0}:root:not([data-theme="light"]) [data-m=teach]{--m:#3cc6bf}:root:not([data-theme="light"]) [data-m=make]{--m:#ff8a3d}:root:not([data-theme="light"]) [data-m]{--m-ink:#141320;--m-soft:color-mix(in srgb,var(--m) 18%,var(--paper))}}
:root[data-theme="dark"] [data-m=spark]{--m:#f3a640}:root[data-theme="dark"] [data-m=ask]{--m:#a78bf0}:root[data-theme="dark"] [data-m=explain]{--m:#3ea7e6}:root[data-theme="dark"] [data-m=feedback]{--m:#6cc777}:root[data-theme="dark"] [data-m=role]{--m:#ef5bb0}:root[data-theme="dark"] [data-m=teach]{--m:#3cc6bf}:root[data-theme="dark"] [data-m=make]{--m:#ff8a3d}:root[data-theme="dark"] [data-m]{--m-ink:#141320;--m-soft:color-mix(in srgb,var(--m) 18%,var(--paper))}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased;margin:0}
h1,h2,h3,h4{font-family:var(--display);margin:0}
p{margin:0}
button{font-family:var(--body);cursor:pointer}
[hidden]{display:none!important}
img{max-width:100%}

.wrap{max-width:var(--maxw);margin:0 auto;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0 48px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--bg);border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:11px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:12px}
.wordmark{font-family:var(--display);font-weight:900;font-size:1.05rem;letter-spacing:-.01em;color:var(--brandgrey)}

.sp{flex:1}
.tbtn{background:transparent;border:1px solid var(--rule);color:var(--ink-soft);border-radius:999px;padding:6px 12px;font-size:.76rem;font-weight:700;text-decoration:none;display:inline-block;line-height:1.5}

.hero{margin-top:24px}
.kick{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--cinnamon);font-family:var(--display)}
.h1{font-family:var(--display);font-weight:900;font-size:clamp(1.9rem,6vw,3rem);letter-spacing:-.01em;line-height:1.03;margin:8px 0 0;color:var(--ink);text-wrap:balance}
.subhead{font-family:var(--display);font-weight:700;font-size:clamp(1.05rem,2.6vw,1.3rem);color:var(--ink);line-height:1.3;margin:12px 0 0;max-width:40ch;text-wrap:balance}
.goal{color:var(--ink-soft);font-size:.95rem;margin-top:10px;max-width:64ch}

.msbanner .mb-k{font-family:var(--display);font-weight:800;font-size:.6rem;letter-spacing:.12em;text-transform:uppercase;background:color-mix(in srgb,var(--cinnamon-ink) 22%,transparent);padding:3px 8px;border-radius:5px;flex:0 0 auto}

.actnav{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.actnav-item{display:flex;align-items:center;gap:9px;background:var(--paper);border:1px solid var(--rule);border-radius:999px;padding:7px 15px 7px 7px;font-family:var(--display);font-weight:800;font-size:.82rem;color:var(--ink-soft)}
.actnav-item .an-n{width:21px;height:21px;border-radius:999px;background:var(--paper-2);color:var(--ink-soft);display:grid;place-items:center;font-size:.72rem;flex:0 0 auto}
.actnav-item:hover{border-color:var(--cinnamon);color:var(--ink)}
.actnav-item[aria-current=true]{background:var(--cinnamon);color:var(--cinnamon-ink);border-color:var(--cinnamon)}

.actbar{display:flex;align-items:center;gap:12px;margin:20px 0 0;flex-wrap:wrap}
.arc{display:flex;gap:5px;flex-wrap:wrap}
.step{font-size:.66rem;font-weight:700;color:var(--ink-soft);background:var(--paper-2);border-radius:999px;padding:5px 12px;font-family:var(--display);letter-spacing:.02em}
.step.done{color:var(--ink)}
.step.on{color:var(--accent-ink);background:var(--accent)}
.screen[data-m] .step.on{background:var(--m);color:var(--m-ink)}

.canvas2{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:stretch;margin-top:14px}
@media(max-width:720px){.canvas2{grid-template-columns:1fr}}
.pane{padding:0;min-width:0;display:flex;flex-direction:column;overflow:hidden;background:var(--paper);border:1px solid var(--rule);border-radius:12px;box-shadow:var(--shadow);border-top:3px solid var(--rule)}
.pane.concept{border-top-color:var(--cinnamon)}
.pane.app{border-top-color:var(--ginger);--accent:var(--ginger);--accent-ink:var(--ginger-ink);--accent-soft:var(--accent-soft)}
.pane.app.playpane{border-top-color:var(--cinnamon);--accent:var(--cinnamon);--accent-ink:var(--cinnamon-ink);--accent-soft:var(--paper-2)}
.screen[data-m] .pane.app{--accent:var(--m);--accent-ink:var(--m-ink);--accent-soft:var(--m-soft);border-top-color:var(--m)}
.pane .hd{display:flex;align-items:center;gap:9px;padding:12px 16px;border-bottom:1px solid var(--rule);background:var(--paper)}
.pane.concept .hd .ico,.pane.concept .hd .nm{color:var(--cinnamon)}
.pane.app .hd .ico,.pane.app .hd .nm{color:var(--ginger)}
.pane.app.playpane .hd .ico,.pane.app.playpane .hd .nm{color:var(--cinnamon)}
.screen[data-m] .pane.app .hd .ico,.screen[data-m] .pane.app .hd .nm{color:var(--m)}
.pane .hd .ico{width:20px;height:20px;flex:0 0 auto}
.pane .hd .nm{font-family:var(--display);font-weight:800;font-size:.95rem;line-height:1.1}

.pane .bd{padding:16px;display:flex;flex-direction:column;flex:1 1 auto;min-width:0}
.pane.active{animation:activepulse 5.5s ease-in-out infinite}
@keyframes activepulse{0%,100%{box-shadow:0 0 0 3px var(--accent-soft)}50%{box-shadow:0 0 0 9px var(--accent-soft)}}
@media (prefers-reduced-motion:reduce){.pane.active{animation:none;box-shadow:0 0 0 7px var(--accent-soft)}}

.ctx{background:var(--paper-2);border-radius:11px;padding:13px 14px;margin-bottom:14px}

.learn-h{font-family:var(--display);font-size:.62rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}

.lpara b{font-weight:700}
.five{list-style:none;padding:0;margin:4px 0 10px;display:grid;gap:6px;counter-reset:fv}
.five li{font-size:.86rem;color:var(--ink);line-height:1.45;padding-left:30px;position:relative;counter-increment:fv}
.five li::before{content:counter(fv);position:absolute;left:0;top:0;width:21px;height:21px;border-radius:999px;background:var(--paper-2);color:var(--cinnamon);font-family:var(--display);font-weight:800;font-size:.72rem;display:grid;place-items:center}

.think{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:7px}

.think li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:2px;background:var(--cinnamon)}
.think li b{font-weight:700}

.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0 2px}

.mcard{display:flex;flex-direction:column;gap:3px;text-align:left;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 11px;color:var(--ink)}

.mcard.muted{opacity:.5}.mcard.muted:hover{opacity:1}
.rec{display:inline-block;vertical-align:middle;font-size:.52rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--m,var(--cinnamon));color:var(--m-ink,var(--cinnamon-ink));border-radius:5px;padding:2px 6px;margin-left:4px}
.pickhint{font-size:.78rem;color:var(--ink-soft);margin-top:9px;line-height:1.45}

label.fl{display:block;font-weight:600;font-size:.84rem;margin:12px 0 5px;color:var(--ink)}
label.fl span{font-weight:400;color:var(--ink-soft)}
textarea{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:9px;padding:10px 11px;font-family:var(--body);font-size:.88rem;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.btnrow{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:.86rem;border-radius:9px;padding:10px 15px;font-family:var(--body)}

.target{margin:10px 0 2px;display:grid;gap:6px}
.trow{display:flex;align-items:center;gap:8px;font-size:.83rem}

.trow .lab{color:var(--ink-soft)}.trow.hit .lab{color:var(--ink);font-weight:600}

.txtout{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:12px 13px;margin-top:10px;font-size:.86rem;line-height:1.55;color:var(--ink);white-space:pre-wrap}

.dosteps{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:9px;counter-reset:ds}

  function makeAI(scr,act){
    var A=act.ai, rail=scr.querySelector(".arc"), body=scr.querySelector(".stageBody"), beat=0;
    function setActive(side){var c=scr.querySelector(".pane.concept"),a=scr.querySelector(".pane.app");if(c)c.classList.toggle("active",side==="learn");if(a)a.classList.toggle("active",side==="do");}

    function wireTools(getP){var cp=body.querySelector("[data-go=copy]");if(cp)cp.onclick=function(){var txt=getP()||"";function d(){cp.textContent="Copied";setTimeout(function(){cp.textContent="Copy my prompt";},1500);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(d).catch(fb);}else fb();function fb(){var t=document.createElement("textarea");t.value=txt;document.body.appendChild(t);t.select();try{document.execCommand("copy");}catch(e){}document.body.removeChild(t);d();}};}
    function renderRail(){rail.innerHTML=STAGES.map(function(s,i){var c=i<beat?"done":i===beat?"on":"";return '<div class="step '+c+'">'+s+'</div>';}).join("");}
    function renderTarget(p){var s=scorePrompt(p);var t=body.querySelector(".target");if(!t)return;t.innerHTML=A.crit.map(function(c){var hit=s[c.k];return '<div class="trow'+(hit?' hit':'')+'"><span class="tk">'+(hit?'&#10003;':'')+'</span><span class="lab">'+esc(c.lab)+'</span></div>';}).join("");}
    function drawGeneric(cv){var x=cv.getContext("2d"),W=cv.width,H=cv.height;x.fillStyle="#0b0b10";x.fillRect(0,0,W,H);function px(a,b,w,h,c){x.fillStyle=c;x.fillRect(Math.round(a),Math.round(b),Math.round(w),Math.round(h));}var u=W/16,cx=W*0.5-u*2,cy=H*0.22;for(var f=0;f<3;f++){var ox=(f-1)*u*0.4;x.globalAlpha=f===1?1:0.4;px(cx+ox,cy,u*2,u*2,"#9a9aa6");px(cx+ox+u*0.4,cy+u*0.6,u*1.2,u*0.5,"#2b2b33");px(cx+ox,cy+u*2,u*2,u*3,"#8b8b97");px(cx+ox-u*0.8,cy+u*2.4,u*0.9,u*2,"#7a7a86");px(cx+ox+u*2,cy+u*2.4,u*0.9,u*2,"#7a7a86");px(cx+ox+u*2.7,cy+u*0.6,u*0.5,u*4,"#c8c8d0");px(cx+ox+u*0.3,cy+u*5,u*0.8,u*2.2,"#6c6c78");px(cx+ox+u*1,cy+u*5,u*0.8,u*2.2,"#6c6c78");}x.globalAlpha=1;}
    function choose(){

    h+='</div></section></div>';
    scr.querySelector(".screen-in").innerHTML=h;
    Array.prototype.forEach.call(scr.querySelectorAll("[data-pc]"),function(b){b.onclick=function(){var txt=document.getElementById(b.getAttribute("data-pc")).textContent;function d(){b.textContent="Copied";setTimeout(function(){b.textContent="Copy prompt";},1500);}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(d).catch(function(){d();});}else d();};});
    var sb=scr.querySelector("[data-go=submit]");if(sb)sb.onclick=function(){ if(SESSION.submitUrl){window.open(SESSION.submitUrl,"_blank","noopener");} sb.textContent="Opened the task ↗";};
  }

  // ---------- share / reflect ----------
  function shareHTML(act){
    var h='<div class="actcard"><div class="hd"><span class="ico">'+ICO.share+'</span><div class="nm">Share · Peer feedback</div></div><div class="bd"><h2>'+esc(act.title)+'</h2><p>'+act.body+'</p>';
    if(act.steps)h+='<ul class="steps">'+act.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ul>';
    if(act.note)h+='<label class="fl" for="peer_'+act.id+'">'+act.note.label+'</label><textarea id="peer_'+act.id+'" rows="3" placeholder="'+esc(act.note.ph)+'"></textarea>';
    h+='</div></div>';return h;
  }
  function reflectHTML(act){
    return '<div class="actcard"><div class="hd"><span class="ico">'+ICO.reflect+'</span><div class="nm">Reflect · Closing</div></div><div class="bd"><h2>'+esc(act.title)+'</h2><p>'+act.body+'</p><label class="fl" for="ref_'+act.id+'">Your reflection</label><textarea id="ref_'+act.id+'" rows="4" placeholder="'+esc(act.ph)+'"></textarea></div></div>';
  }

  // ---------- build ----------
  function pagerHTML(i){
    var last=SESSION.activities.length-1;
    var left=i>0?'<button class="btn ghost" data-go-s="'+(i-1)+'">← Back</button>':'<span></span>';
    var right=i<last?'<button class="btn" data-go-s="'+(i+1)+'">Next: '+esc(SESSION.activities[i+1].nav)+' →</button>':'<span></span>';
    return '<div class="pager">'+left+right+'</div>';
  }
  function buildScreens(){
    var html='';
    SESSION.activities.forEach(function(act,i){
      var inner='';
      if(act.type==="ai"){
        inner='<div class="actbar"><div class="arc"></div></div><div class="canvas2">'+learnHTML(act.learn)+
          '<section class="pane app"><div class="hd"><span class="ico">'+ICO.ai+'</span><div><div class="nm">Do</div><div class="sub">Use the AI</div></div></div><div class="bd"><div class="stageBody"></div></div></section></div>';
      } else if(act.type==="play"){
        inner='<div class="screen-in"></div>';
      } else if(act.type==="share"){ inner=shareHTML(act); }
      else if(act.type==="reflect"){ inner=reflectHTML(act); }
      html+='<section class="screen" id="scr'+i+'"'+(i?' hidden':'')+'>'+inner+pagerHTML(i)+'</section>';
    });
    return html;
  }

  wrap.innerHTML=headerHTML()+navHTML()+buildScreens()+'<div class="patternnote"><b>Pattern preview.</b> Built on the Endless AI training-ground chassis. Any teammate window here runs a scripted version of the real tool so the shape is reviewable; in the live program that window is the real Endless AI teammate. Tokens, teammate colors and class names match the training ground, so your style changes there pull straight into this.</div>';

  // init activities
  SESSION.activities.forEach(function(act,i){
    var scr=document.getElementById("scr"+i);
    if(act.type==="ai")makeAI(scr,act);
    else if(act.type==="play")playHTML(scr,act);
  });

  // nav
  function showScreen(n){SESSION.activities.forEach(function(_,i){document.getElementById("scr"+i).hidden=(i!==n);});Array.prototype.forEach.call(document.querySelectorAll(".actnav-item"),function(b){b.setAttribute("aria-current",b.dataset.s===String(n)?"true":"false");});window.scrollTo(0,0);}
  document.getElementById("actnav").addEventListener("click",function(e){var b=e.target.closest(".actnav-item");if(b)showScreen(+b.dataset.s);});
  document.addEventListener("click",function(e){var b=e.target.closest("[data-go-s]");if(b)showScreen(+b.getAttribute("data-go-s"));});
  showScreen(0);
})();
</script>
