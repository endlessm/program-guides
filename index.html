<script id="data" type="application/json">{"programs": {"Explore: Threadbare": {"order": 1, "sessions": "13 workshops", "hours": "13", "age": "13+", "status": "live", "desc": {"en": "A series of one-hour workshops where learners explore careers across the game industry and make a first contribution to the Threadbare community, one creative discipline at a time.", "es": "Una serie de talleres de una hora donde los estudiantes exploran carreras en la industria de los videojuegos y hacen una primera contribución a la comunidad de Threadbare, una disciplina creativa a la vez."}, "mc": null, "mcSoon": false}, "Explore: Godot": {"order": 2, "sessions": "10 sessions", "hours": "10", "age": "13+", "status": "live", "desc": {"en": "A ten-hour, project-based experience in which learners build a level in a Threadbare-themed platformer in Godot, from first mod to a polished, playable level with a pitch.", "es": "Una experiencia de diez horas basada en proyectos en la que los estudiantes construyen un nivel en un plataformas ambientado en Threadbare usando Godot, desde el primer mod hasta un nivel jugable y pulido con su pitch."}, "mc": "Intro to Game Making with Godot", "mcSoon": false}, "Core: Threadbare": {"order": 3, "sessions": "18 sessions", "hours": "18", "age": "15+", "status": "dev", "desc": {"en": "An 18-session program in the fundamentals of game design using Godot and GitHub. Teams create and submit a StoryQuest, collaborating like real developers on a shared project board. Can be tailored to curricular or social-impact themes.", "es": "Un programa de 18 sesiones sobre los fundamentos del diseño de videojuegos con Godot y GitHub. Los equipos crean y envían una StoryQuest, colaborando como desarrolladores reales en un tablero de proyecto compartido. Se puede adaptar a temas curriculares o de impacto social."}, "mc": "Community Game Making", "mcSoon": false}, "More: Threadbare": {"order": 4, "sessions": "6 milestones", "hours": "12+", "age": "15+", "status": "live", "desc": {"en": "A community game-making experience for learners with prior Godot skills or a completed StoryQuest. Learners take on real issues from the official Threadbare backlog, pursue self-guided deep-dive quests, or create new LoreQuests, with optional facilitated workshops and mentor support.", "es": "Una experiencia comunitaria de creación de videojuegos para estudiantes con experiencia previa en Godot o una StoryQuest completada. Los estudiantes asumen issues reales del backlog oficial de Threadbare, realizan misiones autoguiadas de profundización o crean nuevas LoreQuests, con talleres facilitados opcionales y apoyo de mentores."}, "mc": null, "mcSoon": true}}, "facilitator": {"Explore: Threadbare": {"code": "PreviewETB", "pb_en": "https://docs.google.com/document/d/1kK6ku5B-Ttjw4IBP43X7n6T58wzKpnEVoEPjiAewK6E/edit", "pb_es": ""}, "Explore: Godot": {"code": "PreviewEGO", "pb_en": "https://docs.google.com/document/d/1kK6ku5B-Ttjw4IBP43X7n6T58wzKpnEVoEPjiAewK6E/edit", "pb_es": ""}, "Core: Threadbare": {"code": "PreviewCTB", "pb_en": "https://docs.google.com/document/d/1MySRewwlOK-H8R8NvU1qjbaYRSUkwcu3EV1JUkXqN2U/edit", "pb_es": ""}, "More: Threadbare": {"code": "Coming soon", "pb_en": "https://docs.google.com/document/d/1xxD725zT2--Z5RVde822X_uDkt2p0VUVFgPQuq_9Hdc/edit", "pb_es": "https://docs.google.com/document/d/1kg8FY3SN0igYpZRrwfDs81uiGIpbWKeUNrQtWd0_ur0/edit"}}, "rows": [{"program": "Explore: Threadbare", "seq": "1", "duration": "60", "domain": "Art", "subdomain": "Art: Aesthetics & Visual Design", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 4 Innovative Designer", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "HCD11; IC3; ESR2", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-45", "gmd": "", "ai": "No", "en": {"session": "Aesthetics & Visual Design", "driving": "How can one pixel art asset help shape the story of a game?", "taught": "Open source contribution framing. Play Threadbare and analyse how pixels, colour and shading build mood. Distinguish colour shading from cell shading. Consider light source direction. Design and create an original pixel art asset in Pixel Stitch, then share it and give structured peer feedback.", "deliverable": "Original pixel art asset", "tools": "play.threadbare.game; Pixel Stitch; graph paper"}, "es": {"session": "Estética y Diseño Visual", "driving": "¿Cómo puede un solo asset de pixel art ayudar a moldear la historia de un juego?", "taught": "Marco de contribución de código abierto. Juega Threadbare y analiza cómo los píxeles, el color y el sombreado construyen la atmósfera. Distingue el sombreado por color del sombreado por celdas. Considera la dirección de la fuente de luz. Diseña y crea un asset original de pixel art en Pixel Stitch, compártelo y ofrece retroalimentación estructurada a tus pares.", "deliverable": "Asset original de pixel art", "tools": "play.threadbare.game; Pixel Stitch; papel cuadriculado"}}, {"program": "Explore: Threadbare", "seq": "2", "duration": "60", "domain": "Art", "subdomain": "Art: Animation & Effects", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 4 Innovative Designer", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "HCD11; IC3; ESR2", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-45", "gmd": "", "ai": "No", "en": {"session": "Animation & Effects", "driving": "How can animation deepen the player's connection to the game world?", "taught": "Observe motion in Threadbare and evaluate how movement changes the feel of a scene. Select a static asset from the shared library or reuse own work from workshop 1. Add 5 to 6 frames in Pixel Stitch to create a simple animated sprite. Export as a sprite sheet and share.", "deliverable": "Animated pixel art sprite sheet", "tools": "play.threadbare.game; Pixel Stitch; asset library"}, "es": {"session": "Animación y Efectos", "driving": "¿Cómo puede la animación profundizar la conexión del jugador con el mundo del juego?", "taught": "Observa el movimiento en Threadbare y evalúa cómo el movimiento cambia la sensación de una escena. Selecciona un asset estático de la biblioteca compartida o reutiliza tu trabajo del taller 1. Agrega de 5 a 6 fotogramas en Pixel Stitch para crear un sprite animado simple. Expórtalo como hoja de sprites y compártelo.", "deliverable": "Hoja de sprites animada de pixel art", "tools": "play.threadbare.game; Pixel Stitch; biblioteca de assets"}}, {"program": "Explore: Threadbare", "seq": "3", "duration": "60", "domain": "Art", "subdomain": "Art: Music & Sound", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 4 Innovative Designer", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "HCD11; IC3; ESR2", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-45", "gmd": "", "ai": "No", "en": {"session": "Music & Sound", "driving": "How can sound deepen your connection to a moment in a game?", "taught": "Play a quest and catalogue sounds across three categories: player, interaction and ambient. Reflect on immersion and emotion for each. Create an original sound effect in the Threadbare Melody Loom using BPM, volume, reverb, note range, presets and a waveform editor, or record custom sounds. Export as WAV.", "deliverable": "Original sound effect (WAV)", "tools": "play.threadbare.game; Threadbare Melody Loom"}, "es": {"session": "Música y Sonido", "driving": "¿Cómo puede el sonido profundizar tu conexión con un momento del juego?", "taught": "Juega una misión y cataloga los sonidos en tres categorías: del jugador, de interacción y ambientales. Reflexiona sobre la inmersión y la emoción de cada uno. Crea un efecto de sonido original en el Threadbare Melody Loom usando BPM, volumen, reverberación, rango de notas, presets y un editor de forma de onda, o graba sonidos propios. Expórtalo como WAV.", "deliverable": "Efecto de sonido original (WAV)", "tools": "play.threadbare.game; Threadbare Melody Loom"}}, {"program": "Explore: Threadbare", "seq": "4", "duration": "60", "domain": "Engineering", "subdomain": "Engineering: Gameplay & Systems Programming", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "5 Computational Thinker; 4 Innovative Designer", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Programming", "sub": "Program Development; Variables & Data Storage", "practices": "CT8; CT9; IC3", "ms": "MS-PRO-PD-12; MS-PRO-VD-16", "hs": "HS-PRO-PD-12; HS-PRO-VD-16", "gmd": "S1-GMD-DD-04", "ai": "No", "en": {"session": "Gameplay & Systems Programming", "driving": "How does programming shape what players feel and experience?", "taught": "Introduce the game engineer role. Analyse character movement, speed, turning, stopping and special abilities in Threadbare. Install the Platformer in web Godot. Locate the player script, then modify constants and functions to give the character new movement and abilities. Explicit permission to break things.", "deliverable": "Modified character mechanics (screenshot)", "tools": "play.threadbare.game; Godot (web); Platformer project"}, "es": {"session": "Programación de Jugabilidad y Sistemas", "driving": "¿Cómo moldea la programación lo que los jugadores sienten y experimentan?", "taught": "Presenta el rol de ingeniero de videojuegos. Analiza el movimiento del personaje, la velocidad, el giro, la detención y las habilidades especiales en Threadbare. Instala el Platformer en Godot web. Localiza el script del jugador y luego modifica constantes y funciones para dar al personaje nuevos movimientos y habilidades. Permiso explícito para romper cosas.", "deliverable": "Mecánicas de personaje modificadas (captura de pantalla)", "tools": "play.threadbare.game; Godot (web); proyecto Platformer"}}, {"program": "Explore: Threadbare", "seq": "5", "duration": "60", "domain": "Engineering", "subdomain": "Engineering: Optimization & Performance", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "5 Computational Thinker; 1 Empowered Learner", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Programming", "sub": "Testing & Refining", "practices": "CT9; CT7; IC3", "ms": "MS-PRO-TR-19", "hs": "HS-PRO-TR-19", "gmd": "S1-GMD-AR-07", "ai": "No", "en": {"session": "Optimization & Performance", "driving": "How do unseen systems shape a player's experience moment to moment?", "taught": "Learn to spot performance symptoms: frame drops, stuttering, lag, glitches, slow loads. Play LoreQuests and write a performance report, including confirming when performance is solid. Install the Platformer in Godot, add a spawner component, observe the performance effect, then deliberately improve and degrade it.", "deliverable": "Performance change (screenshot + analysis)", "tools": "play.threadbare.game; Godot; Platformer project"}, "es": {"session": "Optimización y Rendimiento", "driving": "¿Cómo moldean los sistemas invisibles la experiencia del jugador momento a momento?", "taught": "Aprende a detectar síntomas de rendimiento: caídas de fotogramas, tirones, lag, fallos, cargas lentas. Juega LoreQuests y escribe un informe de rendimiento, incluyendo cuándo el rendimiento es sólido. Instala el Platformer en Godot, agrega un componente generador (spawner), observa el efecto en el rendimiento y luego mejóralo y degrádalo deliberadamente.", "deliverable": "Cambio de rendimiento (captura + análisis)", "tools": "play.threadbare.game; Godot; proyecto Platformer"}}, {"program": "Explore: Threadbare", "seq": "6", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Narrative & Storytelling", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 3 Knowledge Constructor", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Humans & Computing; Career Exploration", "practices": "ESR2; HCD11; IC3", "ms": "MS-SOC-HU-43; MS-SOC-CE-44", "hs": "HS-SOC-HU-43; HS-SOC-CE-45", "gmd": "", "ai": "YES - Gemini image generation", "en": {"session": "Narrative & Storytelling", "driving": "How can writing change the player's experience?", "taught": "Play The Musician Quest attending closely to dialogue. Analyse world, characters, story and goal. Write an Artifact of 1 to 2 paragraphs as a found document (letter, diary entry, reflection, song, poem, folk tale or myth) that reconstructs lore the Void has taken. Maintain tone, avoid modern slang, leave room for mystery. Generate an accompanying concept art image with Gemini.", "deliverable": "Written Artifact plus AI concept art", "tools": "play.threadbare.game; Gemini in Google Docs; exemplar templates"}, "es": {"session": "Narrativa y Storytelling", "driving": "¿Cómo puede la escritura cambiar la experiencia del jugador?", "taught": "Juega The Musician Quest prestando atención al diálogo. Analiza mundo, personajes, historia y objetivo. Escribe un Artefacto de 1 a 2 párrafos como documento encontrado (carta, entrada de diario, reflexión, canción, poema, cuento folclórico o mito) que reconstruya la tradición que el Vacío se ha llevado. Mantén el tono, evita el argot moderno y deja espacio para el misterio. Genera una imagen de arte conceptual con Gemini.", "deliverable": "Artefacto escrito más arte conceptual con IA", "tools": "play.threadbare.game; Gemini en Google Docs; plantillas de ejemplo"}}, {"program": "Explore: Threadbare", "seq": "7", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Core Gameplay & Mechanics", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "4 Innovative Designer; 5 Computational Thinker", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Algorithms & Design", "sub": "Algorithmic Problem Solving", "practices": "CT6; CT7; IC3", "ms": "MS-ALG-PS-01; MS-ALG-PS-02", "hs": "HS-ALG-PS-01; HS-ALG-PS-02", "gmd": "S1-GMD-DD-01; S1-GMD-DD-02", "ai": "No", "en": {"session": "Core Gameplay & Mechanics", "driving": "What makes the player return to a game over and over again?", "taught": "Play Stella and the Missing Star and record the actions required in each mini game. Learn the ACTIONS-REWARD-EXPANSION core loop and identify it in the quest. Learn how game storyboards differ from film and comic storyboards. Choose a Threadbare character and design a core loop for them as a platformer protagonist, then storyboard it.", "deliverable": "Core loop storyboard", "tools": "play.threadbare.game; storyboard template"}, "es": {"session": "Jugabilidad Central y Mecánicas", "driving": "¿Qué hace que el jugador regrese a un juego una y otra vez?", "taught": "Juega Stella and the Missing Star y registra las acciones requeridas en cada minijuego. Aprende el bucle central ACCIONES-RECOMPENSA-EXPANSIÓN e identifícalo en la misión. Aprende en qué se diferencian los storyboards de videojuegos de los del cine y el cómic. Elige un personaje de Threadbare y diseña un bucle central para él como protagonista de plataformas, luego crea su storyboard.", "deliverable": "Storyboard del bucle central", "tools": "play.threadbare.game; plantilla de storyboard"}}, {"program": "Explore: Threadbare", "seq": "8", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Game Feel & UX", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "4 Innovative Designer; 6 Creative Communicator", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Algorithms & Design", "sub": "Impacts of Algorithms & Design", "practices": "HCD10; HCD11; HCD12", "ms": "MS-ALG-IM-09", "hs": "HS-ALG-IM-09", "gmd": "S1-GMD-PX-05", "ai": "No", "en": {"session": "Game Feel & UX", "driving": "How do designers invite players to discover their own path through a game?", "taught": "Play Threadbare Stealth and identify what invited movement through the scene. Learn signposting as a technique for guiding players without instruction. Analyse where the eye goes first and why, across texture, pattern, sound and light. Design signposting to guide a player to a specific house in Fray's End by sketching on the level image.", "deliverable": "Signposting concept sketch", "tools": "play.threadbare.game (Stealth); level image; sketch tool"}, "es": {"session": "Sensación de Juego y UX", "driving": "¿Cómo invitan los diseñadores a los jugadores a descubrir su propio camino en un juego?", "taught": "Juega Threadbare Stealth e identifica qué invitó a moverse por la escena. Aprende el signposting como técnica para guiar a los jugadores sin instrucciones. Analiza hacia dónde va la mirada primero y por qué, considerando textura, patrón, sonido y luz. Diseña el signposting para guiar a un jugador hacia una casa específica en Fray's End dibujando sobre la imagen del nivel.", "deliverable": "Boceto conceptual de signposting", "tools": "play.threadbare.game (Stealth); imagen del nivel; herramienta de dibujo"}}, {"program": "Explore: Threadbare", "seq": "9", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Progression & Motivation", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "4 Innovative Designer; 5 Computational Thinker", "iste_ct": "Computational Thinking; Creativity & Design", "concept": "Algorithms & Design", "sub": "Algorithmic Problem Solving", "practices": "CT6; CT7; HCD11", "ms": "MS-ALG-PS-01; MS-ALG-PS-02", "hs": "HS-ALG-PS-01; HS-ALG-PS-02", "gmd": "", "ai": "No", "en": {"session": "Progression & Motivation", "driving": "How do game makers give the core loop a refresh?", "taught": "Play The Void Runner Quest until a new ability is unlocked, then analyse the ability and the challenges it overcame. Learn how skill trees keep familiar challenges fresh. Design a Storyweaver skill tree focused on evolving one ability or a themed set such as movement, gadgets or exploration, choosing icons, skill names and upgrade descriptions.", "deliverable": "Skill tree design", "tools": "play.threadbare.game; skill tree app"}, "es": {"session": "Progresión y Motivación", "driving": "¿Cómo renuevan los creadores de juegos el bucle central?", "taught": "Juega The Void Runner Quest hasta desbloquear una nueva habilidad, luego analiza la habilidad y los desafíos que superó. Aprende cómo los árboles de habilidades mantienen frescos los desafíos familiares. Diseña un árbol de habilidades de Storyweaver centrado en evolucionar una habilidad o un conjunto temático como movimiento, gadgets o exploración, eligiendo íconos, nombres de habilidades y descripciones de mejora.", "deliverable": "Diseño de árbol de habilidades", "tools": "play.threadbare.game; app de árbol de habilidades"}}, {"program": "Explore: Threadbare", "seq": "10", "duration": "60", "domain": "Go to Market", "subdomain": "Go to Market: Marketing", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 3 Knowledge Constructor", "iste_ct": "Equity Leader; Creativity & Design", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "HCD10; IC3; ESR1", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-45", "gmd": "", "ai": "No", "en": {"session": "Marketing", "driving": "How can we bring a digital game to life for players to enjoy in the real world?", "taught": "Learn what a persona is and why marketing teams use them. Select or create a persona, then play Threadbare in character and take notes on what stands out to them. Analyse which characters, moments and emotions matter to that persona and what would connect to the real world. Design physical swag reflecting those insights.", "deliverable": "Swag mockup (PNG)", "tools": "play.threadbare.game; kleki.com; asset templates"}, "es": {"session": "Marketing", "driving": "¿Cómo podemos dar vida a un juego digital para que los jugadores lo disfruten en el mundo real?", "taught": "Aprende qué es un persona y por qué los equipos de marketing los usan. Selecciona o crea un persona, luego juega Threadbare en ese personaje y toma notas de lo que le llama la atención. Analiza qué personajes, momentos y emociones le importan a ese persona y qué conectaría con el mundo real. Diseña merchandising físico que refleje esos hallazgos.", "deliverable": "Maqueta de merchandising (PNG)", "tools": "play.threadbare.game; kleki.com; plantillas de assets"}}, {"program": "Explore: Threadbare", "seq": "11", "duration": "60", "domain": "Go to Market", "subdomain": "Go to Market: Publishing & Distribution", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 2 Digital Citizen", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Emerging Technologies; Career Exploration", "practices": "ESR2; HCD11; IC3", "ms": "MS-SOC-ET-40; MS-SOC-CE-44", "hs": "HS-SOC-ET-40; HS-SOC-CE-45", "gmd": "", "ai": "YES - AI assets and tagline", "en": {"session": "Publishing & Distribution", "driving": "How do players get games?", "taught": "Play a LoreQuest and form an overall judgement of the game and its strongest quality. Research how players discover games. Learn the distinction between publishing and distribution. Build a promotional poster deciding what information it must carry, using own screenshots, AI generated supporting assets and an AI generated tagline.", "deliverable": "Promotional poster", "tools": "play.threadbare.game; Excalidraw or Slides; AI image and text tools"}, "es": {"session": "Publicación y Distribución", "driving": "¿Cómo obtienen los jugadores los juegos?", "taught": "Juega una LoreQuest y forma un juicio general sobre el juego y su mejor cualidad. Investiga cómo los jugadores descubren juegos. Aprende la distinción entre publicación y distribución. Crea un póster promocional decidiendo qué información debe incluir, usando tus propias capturas, assets de apoyo generados con IA y un eslogan generado con IA.", "deliverable": "Póster promocional", "tools": "play.threadbare.game; Excalidraw o Slides; herramientas de imagen y texto con IA"}}, {"program": "Explore: Threadbare", "seq": "12", "duration": "60", "domain": "Management & Production", "subdomain": "Management & Production: Project & Workflow Management", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "7 Global Collaborator; 4 Innovative Designer", "iste_ct": "Collaborating Around Computing; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "IC4; IC5; IC3", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-45", "gmd": "S1-GMD-PP-09", "ai": "No", "en": {"session": "Project & Workflow Management", "driving": "How can you lead a team to enhance a game experience?", "taught": "Play a LoreQuest and capture 3 to 4 feeling words. Step into the producer role. Learn what Adventure Packs are and research moodboards. Assemble a small team of 2 to 3 people, choose a word from the play notes and build a moodboard together to generate a new Adventure Pack idea. Then create the task list that would deliver it.", "deliverable": "Moodboard plus AP worksheet", "tools": "play.threadbare.game; Excalidraw or Mood.site; AP worksheet template"}, "es": {"session": "Gestión de Proyectos y Flujo de Trabajo", "driving": "¿Cómo puedes liderar un equipo para mejorar una experiencia de juego?", "taught": "Juega una LoreQuest y captura de 3 a 4 palabras de sensación. Asume el rol de productor. Aprende qué son los Adventure Packs e investiga los moodboards. Reúne un equipo pequeño de 2 a 3 personas, elige una palabra de tus notas de juego y construyan juntos un moodboard para generar una idea de nuevo Adventure Pack. Luego crea la lista de tareas para desarrollarlo.", "deliverable": "Moodboard más hoja de trabajo de AP", "tools": "play.threadbare.game; Excalidraw o Mood.site; plantilla de AP"}}, {"program": "Explore: Threadbare", "seq": "13", "duration": "60", "domain": "Management & Production", "subdomain": "Management & Production: Quality Assurance & Playtesting", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "5 Computational Thinker; 7 Global Collaborator", "iste_ct": "Computational Thinking; Collaborating Around Computing", "concept": "Programming", "sub": "Testing & Refining", "practices": "CT9; IC3; HCD10", "ms": "MS-PRO-TR-19; MS-PRO-TR-20", "hs": "HS-PRO-TR-19; HS-PRO-TR-20", "gmd": "S1-GMD-PX-06", "ai": "No", "en": {"session": "QA & Playtesting", "driving": "How does a development team make sure that a game is ready to be released?", "taught": "Play any quest and evaluate goal clarity and intended emotional effect. Learn the six QA checks: control clarity, player direction, difficulty balance, bugs, design soundness and engagement. Play a Threadbare platformer twice, capture three screenshots of issues, then annotate them on a whiteboard explaining the proposed fix.", "deliverable": "Three annotated bug or improvement reports", "tools": "play.threadbare.game; Threadbare Platformer; Excalidraw"}, "es": {"session": "QA y Playtesting", "driving": "¿Cómo se asegura un equipo de desarrollo de que un juego está listo para lanzarse?", "taught": "Juega cualquier misión y evalúa la claridad del objetivo y el efecto emocional buscado. Aprende las seis verificaciones de QA: claridad de controles, dirección del jugador, balance de dificultad, bugs, solidez del diseño y engagement. Juega dos veces un plataformas de Threadbare, captura tres pantallazos de problemas y luego anótalos en una pizarra explicando la solución propuesta.", "deliverable": "Tres reportes anotados de bugs o mejoras", "tools": "play.threadbare.game; Threadbare Platformer; Excalidraw"}}, {"program": "Explore: Godot", "seq": "1", "duration": "60", "domain": "Engineering", "subdomain": "No XP assignment (practice task)", "xp": "0", "skills": {"Problem Solving": "n/a", "Creativity & Design Thinking": "n/a", "Technical Literacy": "n/a"}, "iste_students": "1 Empowered Learner; 5 Computational Thinker", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Programming", "sub": "Program Development; Testing & Refining", "practices": "CT8; CT9; IC3", "ms": "MS-PRO-PD-12; MS-PRO-TR-19", "hs": "HS-PRO-PD-12; HS-PRO-TR-19", "gmd": "S1-GMD-DD-01; S1-GMD-DD-04", "ai": "No", "en": {"session": "Session 1 | Pong Mods", "driving": "Why do we play games? Why do we mod them?", "taught": "Compare the first game you ever played to games today across graphics, mechanics, story and the tools used to make them. Download and run Godot, install the Moddable Pong project and play it. Learn the widely accepted basic game elements and apply them to Pong: goal, rules, mechanics, space, components, challenge. Mod Pong to make it fresher or more challenging, with optional soundtrack and image additions. Close with blue sky brainstorming in a game design journal.", "deliverable": "Pong mod plus documentation", "tools": "Godot; Moddable Pong; Remove.bg; Incompetech; Freesound; The Melody Loom"}, "es": {"session": "Sesión 1 | Mods de Pong", "driving": "¿Por qué jugamos videojuegos? ¿Por qué los modificamos?", "taught": "Compara el primer juego que jugaste con los juegos de hoy en gráficos, mecánicas, historia y las herramientas usadas para crearlos. Descarga y ejecuta Godot, instala el proyecto Moddable Pong y juégalo. Aprende los elementos básicos de un juego y aplícalos a Pong: objetivo, reglas, mecánicas, espacio, componentes, desafío. Modifica Pong para hacerlo más fresco o desafiante, con banda sonora e imágenes opcionales. Cierra con una lluvia de ideas libre en un diario de diseño de juegos.", "deliverable": "Mod de Pong más documentación", "tools": "Godot; Moddable Pong; Remove.bg; Incompetech; Freesound; The Melody Loom"}}, {"program": "Explore: Godot", "seq": "2", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Core Gameplay & Mechanics", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "5 Computational Thinker; 3 Knowledge Constructor", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Programming", "sub": "Program Development", "practices": "CT8; CT7; IC3", "ms": "MS-PRO-PD-12", "hs": "HS-PRO-PD-12", "gmd": "S1-GMD-DD-04", "ai": "No", "en": {"session": "Session 2 | Platformer Mod", "driving": "Should game makers also be game players?", "taught": "Reflect on a favourite platformer and what makes the genre appealing. Keep a game design journal while playing free 2D platformers (Pikwip, Kiko Adventure, Climbable Arrow, Jumping Shell). Learn the Action to Reward to Expansion core loop and identify it in what was played. Download the Moddable Platformer, compare it to the others and plan two or three mods. Explore the scene tree, file system and inspector, making small changes and testing often.", "deliverable": "Platformer mod plus documentation", "tools": "Godot; Moddable Platformer; four external 2D platformers"}, "es": {"session": "Sesión 2 | Mod de Plataformas", "driving": "¿Los creadores de juegos también deberían ser jugadores?", "taught": "Reflexiona sobre tu plataformas favorito y qué hace atractivo al género. Mantén un diario de diseño mientras juegas plataformas 2D gratuitos (Pikwip, Kiko Adventure, Climbable Arrow, Jumping Shell). Aprende el bucle central Acción-Recompensa-Expansión e identifícalo en lo que jugaste. Descarga el Moddable Platformer, compáralo con los otros y planifica dos o tres mods. Explora el árbol de escenas, el sistema de archivos y el inspector, haciendo cambios pequeños y probando con frecuencia.", "deliverable": "Mod de plataformas más documentación", "tools": "Godot; Moddable Platformer; cuatro plataformas 2D externos"}}, {"program": "Explore: Godot", "seq": "3", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Game Feel & UX", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "4 Innovative Designer; 5 Computational Thinker", "iste_ct": "Creativity & Design; Computational Thinking", "concept": "Algorithms & Design", "sub": "Algorithmic Problem Solving; Impacts of Algorithms & Design", "practices": "HCD11; CT8; HCD10", "ms": "MS-ALG-PS-01; MS-ALG-IM-09", "hs": "HS-ALG-PS-01; HS-ALG-IM-09", "gmd": "S1-GMD-DD-03", "ai": "No", "en": {"session": "Session 3 | Practice Level", "driving": "How do game makers create a fun and engaging level?", "taught": "Open by debating whether frustration can be good in a game. Learn grayboxing as building a rough level to test how jumps, enemies and flow feel before adding visuals. Decide the intended audience and emotional register, and how difficulty will be introduced gradually. Remix and extend the existing basic level into something playable start to finish, shifting from playful tinkering to whole-level feel.", "deliverable": "Playable practice level", "tools": "Godot; Moddable Platformer"}, "es": {"session": "Sesión 3 | Nivel de Práctica", "driving": "¿Cómo crean los creadores de juegos un nivel divertido y atractivo?", "taught": "Abre debatiendo si la frustración puede ser buena en un juego. Aprende el grayboxing como construir un nivel rudimentario para probar cómo se sienten los saltos, enemigos y el flujo antes de agregar visuales. Decide el público objetivo y el registro emocional, y cómo se introducirá la dificultad gradualmente. Remezcla y extiende el nivel básico existente hasta convertirlo en algo jugable de principio a fin, pasando del juego exploratorio a la sensación de nivel completo.", "deliverable": "Nivel de práctica jugable", "tools": "Godot; Moddable Platformer"}}, {"program": "Explore: Godot", "seq": "4", "duration": "60", "domain": "Engineering", "subdomain": "No XP assignment (practice task)", "xp": "0", "skills": {"Problem Solving": "n/a", "Creativity & Design Thinking": "n/a", "Technical Literacy": "n/a"}, "iste_students": "5 Computational Thinker; 4 Innovative Designer", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Algorithms & Design", "sub": "Algorithmic Problem Solving", "practices": "CT6; CT7; IC3", "ms": "MS-ALG-PS-01; MS-ALG-PS-02", "hs": "HS-ALG-PS-01; HS-ALG-PS-02", "gmd": "", "ai": "No", "en": {"session": "Session 4 | Problem Decomp", "driving": "What helps an idea move from concept to something real?", "taught": "Consider the competing pressures game makers face across technical, creative and player-related concerns, and how to decide what matters most. Learn decomposition: game components look like single ideas but are built from smaller tasks. Break one chosen feature into subtasks across controls and input, interactions, and animation or sound, then break those down further. Begin a Level Design Document. Replay the platformer with a designer's eye, noting reusable mechanics and patterns.", "deliverable": "Decomposition diagram plus LDD draft", "tools": "tldraw or paper; LDD template; Godot"}, "es": {"session": "Sesión 4 | Descomposición de Problemas", "driving": "¿Qué ayuda a que una idea pase del concepto a algo real?", "taught": "Considera las presiones que enfrentan los creadores de juegos en lo técnico, lo creativo y lo relacionado con el jugador, y cómo decidir qué importa más. Aprende la descomposición: los componentes de un juego parecen ideas únicas pero se construyen a partir de tareas más pequeñas. Divide una función elegida en subtareas de controles y entradas, interacciones y animación o sonido, y luego divídelas aún más. Comienza un Documento de Diseño de Nivel. Vuelve a jugar el plataformas con ojo de diseñador, anotando mecánicas y patrones reutilizables.", "deliverable": "Diagrama de descomposición más borrador del LDD", "tools": "tldraw o papel; plantilla de LDD; Godot"}}, {"program": "Explore: Godot", "seq": "5", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Progression & Motivation", "xp": "150", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "4 Innovative Designer; 7 Global Collaborator", "iste_ct": "Creativity & Design; Collaborating Around Computing", "concept": "Programming", "sub": "Testing & Refining; Program Development", "practices": "CT9; IC3; HCD10", "ms": "MS-PRO-PD-12; MS-PRO-TR-19; MS-PRO-TR-20", "hs": "HS-PRO-PD-12; HS-PRO-TR-19; HS-PRO-TR-20", "gmd": "S1-GMD-DD-03; S1-GMD-PX-06", "ai": "No", "en": {"session": "Session 5 | Level Design Document", "driving": "What makes a level good? What makes it great?", "taught": "Brainstorm how to surprise the player through hidden areas, pacing changes, dynamic elements or visual and audio twists. Continue building the level against the LDD and decomposition drafts, adding at least one surprise. Learn playtesting considerations, then choose one specific element to get feedback on, publish the working level and LDD with one or two targeted feedback questions, play at least two other learners' levels and leave feedback. Review responses and decide what to change.", "deliverable": "Working level plus LDD plus feedback questions", "tools": "Godot; LDD; platform game page"}, "es": {"session": "Sesión 5 | Documento de Diseño de Nivel", "driving": "¿Qué hace bueno a un nivel? ¿Qué lo hace excelente?", "taught": "Genera ideas sobre cómo sorprender al jugador mediante áreas ocultas, cambios de ritmo, elementos dinámicos o giros visuales y sonoros. Continúa construyendo el nivel según el LDD y los borradores de descomposición, agregando al menos una sorpresa. Aprende consideraciones de playtesting, luego elige un elemento específico para recibir retroalimentación, publica el nivel funcional y el LDD con una o dos preguntas dirigidas, juega al menos dos niveles de otros estudiantes y deja retroalimentación. Revisa las respuestas y decide qué cambiar.", "deliverable": "Nivel funcional más LDD más preguntas de retroalimentación", "tools": "Godot; LDD; página del juego en la plataforma"}}, {"program": "Explore: Godot", "seq": "6-8", "duration": "180", "domain": "Management & Production", "subdomain": "Management & Production: Quality Assurance & Playtesting", "xp": "200", "skills": {"Problem Solving": "Minimal", "Creativity & Design Thinking": "Moderate", "Technical Literacy": "Moderate"}, "iste_students": "4 Innovative Designer; 7 Global Collaborator; 1 Empowered Learner", "iste_ct": "Collaborating Around Computing; Creativity & Design; Integrating Computational Thinking", "concept": "Programming", "sub": "Testing & Refining", "practices": "CT9; HCD11; IC5", "ms": "MS-PRO-TR-19; MS-PRO-TR-20", "hs": "HS-PRO-TR-19; HS-PRO-TR-20", "gmd": "S1-GMD-DD-03; S1-GMD-PX-06", "ai": "No", "en": {"session": "Sessions 6-8 | Working Level & LDD", "driving": "What makes a level good? What makes it great?", "taught": "Three sessions running the same build, playtest and refine cycle against a different design lens each time. Session 6 asks how the player should feel and what they would say. Session 7 asks whether the level invites playful curiosity even if the goal were ignored. Session 8 asks how time shapes the level, covering limits, timed moments and pacing pressure. Each session includes 30 to 40 minutes of building, targeted peer feedback on one element, and playing at least two other learners' levels. Session 8 also introduces the pitch as a persuasive format.", "deliverable": "Refined level across three iterations", "tools": "Godot; LDD; platform game page; pitch deck template"}, "es": {"session": "Sesiones 6-8 | Nivel Funcional y LDD", "driving": "¿Qué hace bueno a un nivel? ¿Qué lo hace excelente?", "taught": "Tres sesiones que repiten el mismo ciclo de construir, probar y refinar con una perspectiva de diseño distinta cada vez. La sesión 6 pregunta cómo debería sentirse el jugador y qué diría. La sesión 7 pregunta si el nivel invita a la curiosidad lúdica aun ignorando el objetivo. La sesión 8 pregunta cómo el tiempo moldea el nivel, cubriendo límites, momentos cronometrados y presión de ritmo. Cada sesión incluye de 30 a 40 minutos de construcción, retroalimentación dirigida sobre un elemento y jugar al menos dos niveles de otros estudiantes. La sesión 8 también introduce el pitch como formato persuasivo.", "deliverable": "Nivel refinado a lo largo de tres iteraciones", "tools": "Godot; LDD; página del juego en la plataforma; plantilla de pitch deck"}}, {"program": "Explore: Godot", "seq": "9", "duration": "60", "domain": "Go to Market", "subdomain": "Go to Market: Marketing (175) + Art: Aesthetics & Visual Design (150)", "xp": "325", "skills": {"Problem Solving": "Mixed: Moderate / Minimal", "Creativity & Design Thinking": "Minimal", "Technical Literacy": "Minimal"}, "iste_students": "6 Creative Communicator; 4 Innovative Designer", "iste_ct": "Creativity & Design; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration", "practices": "IC3; HCD12; ESR1", "ms": "MS-SOC-CE-44", "hs": "HS-SOC-CE-46", "gmd": "", "ai": "No", "en": {"session": "Session 9 | Pitch Deck", "driving": "What makes a level polished?", "taught": "Identify the finishing touches that would make the work something to be proud of. Use accumulated player feedback to retouch final details, then learn to export the game as a zip so anyone can play it. Complete the pitch deck, raising any questions or concerns needed to move forward with clarity. Close by planning how to show the level off, prioritising real gameplay over slides and leading with the most surprising or impressive moments.", "deliverable": "Exported level (zip) plus completed pitch deck", "tools": "Godot; pitch deck template"}, "es": {"session": "Sesión 9 | Pitch Deck", "driving": "¿Qué hace que un nivel esté pulido?", "taught": "Identifica los toques finales que harían del trabajo algo de lo cual enorgullecerse. Usa la retroalimentación acumulada de los jugadores para retocar los detalles finales, luego aprende a exportar el juego como zip para que cualquiera pueda jugarlo. Completa el pitch deck, planteando dudas o inquietudes necesarias para avanzar con claridad. Cierra planificando cómo mostrar el nivel, priorizando el gameplay real sobre las diapositivas y comenzando por los momentos más sorprendentes o impresionantes.", "deliverable": "Nivel exportado (zip) más pitch deck completo", "tools": "Godot; plantilla de pitch deck"}}, {"program": "Explore: Godot", "seq": "10", "duration": "60", "domain": "Game Design", "subdomain": "Game Design: Core Gameplay & Mechanics (225) + Game Feel & UX (150) + Progression & Motivation (150)", "xp": "525", "skills": {"Problem Solving": "Mixed: Moderate / Minimal", "Creativity & Design Thinking": "Mixed: Moderate / Minimal", "Technical Literacy": "Mixed: Moderate / Minimal"}, "iste_students": "6 Creative Communicator; 7 Global Collaborator; 1 Empowered Learner", "iste_ct": "Collaborating Around Computing; Integrating Computational Thinking", "concept": "Computing & Society", "sub": "Career Exploration; Humans & Computing", "practices": "IC3; IC5; ESR1", "ms": "MS-SOC-CE-44; MS-SOC-HU-43", "hs": "HS-SOC-CE-46; HS-SOC-HU-43", "gmd": "", "ai": "No", "en": {"session": "Session 10 | Final Level", "driving": "Where do you go from here?", "taught": "Reflect on what was most enjoyable and what advice to give a newcomer to Godot. Record a screen capture of the pitch deck presentation or share the file, ideally with gameplay footage and reflection on challenges faced. Upload the finished level as a zip. Give feedback to others on what is strong in their projects and what their next steps in game design might be. Close on the single most useful piece of feedback received across the whole programme.", "deliverable": "Final level (zip) plus recorded pitch", "tools": "Godot; screen recording; platform"}, "es": {"session": "Sesión 10 | Nivel Final", "driving": "¿Hacia dónde vas a partir de aquí?", "taught": "Reflexiona sobre lo que más disfrutaste y qué consejo darías a alguien nuevo en Godot. Graba una captura de pantalla de la presentación del pitch deck o comparte el archivo, idealmente con gameplay y una reflexión sobre los desafíos enfrentados. Sube el nivel terminado como zip. Da retroalimentación a otros sobre lo que es fuerte en sus proyectos y cuáles serían sus próximos pasos en diseño de juegos. Cierra con la pieza de retroalimentación más útil recibida en todo el programa.", "deliverable": "Nivel final (zip) más pitch grabado", "tools": "Godot; grabación de pantalla; plataforma"}}, {"program": "More: Threadbare", "seq": "M1", "duration": "60", "domain": "Management & Production", "subdomain": "Not on platform - GitHub based", "xp": "varies", "skills": {"Problem Solving": "varies", "Creativity & Design Thinking": "varies", "Technical Literacy": "varies"}, "iste_students": "1 Empowered Learner; 7 Global Collaborator", "iste_ct": "Computational Thinking; Equity Leader", "concept": "Computing & Society", "sub": "Career Exploration; Humans & Computing", "practices": "IC3; IC5; ESR1", "ms": "MS-SOC-CE-44; MS-SOC-HU-43", "hs": "HS-SOC-CE-46; HS-SOC-HU-43", "gmd": "", "ai": "No", "en": {"session": "Milestone 1 | Orient + Select", "driving": "What part of Threadbare's core game systems are you excited to improve or extend?", "taught": "Complete the pre-survey. Review the live Threadbare backlog on the public project board to understand the real range of contributions the project needs. Watch the backlog overview video and, if needed, the guide to raising a new issue. Identify which open issues align with personal strengths and interests, then claim one by commenting an intent to work on it. A Threadbare maintainer then assigns the issue.", "deliverable": "Claimed backlog issue", "tools": "GitHub project board; Threadbare repo; Airtable pre-survey"}, "es": {"session": "Hito 1 | Orientar + Seleccionar", "driving": "¿Qué parte de los sistemas centrales de Threadbare te entusiasma mejorar o ampliar?", "taught": "Completa la encuesta previa. Revisa el backlog en vivo de Threadbare en el tablero de proyecto público para entender el rango real de contribuciones que el proyecto necesita. Mira el video general del backlog y, si hace falta, la guía para plantear un nuevo issue. Identifica qué issues abiertos se alinean con tus fortalezas e intereses, luego reclama uno comentando tu intención de trabajarlo. Un mantenedor de Threadbare te asigna el issue.", "deliverable": "Issue del backlog reclamado", "tools": "Tablero de proyecto de GitHub; repo de Threadbare; encuesta previa en Airtable"}}, {"program": "More: Threadbare", "seq": "M2", "duration": "120", "domain": "Management & Production", "subdomain": "Not on platform - GitHub based", "xp": "varies", "skills": {"Problem Solving": "varies", "Creativity & Design Thinking": "varies", "Technical Literacy": "varies"}, "iste_students": "5 Computational Thinker; 4 Innovative Designer", "iste_ct": "Computational Thinking; Integrating Computational Thinking", "concept": "Algorithms & Design", "sub": "Algorithmic Problem Solving", "practices": "CT6; CT7; IC4", "ms": "MS-ALG-PS-01; MS-ALG-PS-02", "hs": "HS-ALG-PS-01; HS-ALG-PS-02", "gmd": "S1-GMD-DD-01; S1-GMD-DD-02", "ai": "No", "en": {"session": "Milestone 2 | Research + Plan", "driving": "What does success look like for this feature or fix? What dependencies or systems might be affected?", "taught": "Break the chosen issue into actionable steps and draft a design or implementation approach. Complete a planning worksheet. Produce supporting documentation appropriate to the domain of game making being worked in, which may include diagrams or storyboard drafts. Attach all planning documentation directly to the selected issue on the backlog so maintainers and peers can see the intended approach before any code is written.", "deliverable": "Planning worksheet plus documentation attached to issue", "tools": "Planning worksheet; domain documentation guide; GitHub"}, "es": {"session": "Hito 2 | Investigar + Planificar", "driving": "¿Cómo se ve el éxito para esta función o corrección? ¿Qué dependencias o sistemas podrían verse afectados?", "taught": "Divide el issue elegido en pasos accionables y esboza un enfoque de diseño o implementación. Completa una hoja de trabajo de planificación. Produce documentación de apoyo apropiada al ámbito de creación de juegos en el que trabajas, que puede incluir diagramas o borradores de storyboard. Adjunta toda la documentación de planificación directamente al issue seleccionado en el backlog para que mantenedores y pares vean el enfoque previsto antes de escribir código.", "deliverable": "Hoja de planificación más documentación adjunta bare para que los pares puedan jugar el trabajo en lugar de solo leer sobre él. Publica un enlace junto con preguntas específicas que quieras responder, usando la estructura del formulario de retroalimentación. Implementa las sugerencias resultantes. Se programa según sea necesario durante el Hito 3 y no como un bloque fijo.", "deliverable": "Build publicado más retroalimentación implementada", "tools": "Web builds del fork de Threadbare; formulario de retroalimentación; canales de la comunidad"}}, {"program": "More: Threadbare", "seq": "M3c", "duration": "0", "domain": "Engineering", "subdomain": "Not on platform - GitHub based", "xp": "varies", "skills": {"Problem Solving": "varies", "Creativity & Design Thinking": "varies", "Technical Literacy": "varies"}, "iste_students": "7 Global Collaborator; 2 Digital Citizen", "iste_ct": "Collaborating Around Computing; Equity Leader", "concept": "Programming", "sub": "Program Development; Reading & Documenting", "practices": "IC5; ESR2; IC4", "ms": "MS-PRO-PD-13; MS-PRO-PD-14; MS-PRO-RD-17", "hs": "HS-PRO-PD-13; HS-PRO-PD-14; HS-PRO-RD-17", "gmd": "S1-GMD-PP-08; S1-GMD-PP-09", "ai": "No", "en": {"session": "Milestone 3c | Finalize + Submit", "driving": "Did you document your choices clearly? Have all parts of your system been tested?", "taught": "Polish the feature, test thoroughly and prepare documentation. Follow the official Threadbare CONTRIBUTING guide to ensure every submission step is complete, then approach a project maintainer for review and final merge. Learners with further issues to work on return to Milestone 3a and repeat the cycle.", "deliverable": "Merged contribution to the shared project", "tools": "GitHub; Threadbare CONTRIBUTING guide"}, "es": {"session": "Hito 3c | Finalizar + Enviar", "driving": "¿Documentaste tus decisiones con claridad? ¿Se han probado todas las partes de tu sistema?", "taught": "Pule la función, prueba a fondo y prepara la documentación. Sigue la guía oficial CONTRIBUTING de Thread lobal Collaborator": "Learners broaden perspectives and enrich learning by collaborating with others."}, "iste_ct": {"Computational Thinking": "Educators develop an understanding of computational thinking and its application as a cross-curricular skill.", "Equity Leader": "Educators foster an inclusive culture where all students and educators can be computational thinkers and CS learners.", "Collaborating Around Computing": "Educators incorporate diverse perspectives and unique skills when developing student learning opportunities.", "Creativity & Design": "Educators use CT to empower students to create computational artifacts for personal expression.", "Integrating Computational Thinking": "Educators integrate computational thinking practices into the classroom across disciplines."}, "coreMilestones": {"1": {"en": "Milestone 1: Concepts & ideas", "es": "Hito 1: Conceptos e ideas"}, "2": {"en": "Milestone 2: Setup & first build", "es": "Hito 2: Preparación y primera construcción"}, "3": {"en": "Milestone 3: Build", "es": "Hito 3: Construcción"}, "4": {"en": "Milestone 4: Playtest, refine & publish", "es": "Hito 4: Prueba, refinamiento y publicación"}, "5": {"en": "Milestone 5: Pitch & reflect", "es": "Hito 5: Presentación y reflexión"}}, "intro": {"lead": {"en": "Threadbare is a free, open-source, narrative RPG built in Godot and hosted on GitHub. Across our programs, learners move from playing it to contributing real work to it, building future-ready skills that map to recognized standards.", "es": "Threadbare es un RPG narrativo gratuito y de código abierto, creado en Godot y alojado en GitHub. A lo largo de nuestros programas, los estudiantes pasan de jugarlo a contribuir con trabajo real, desarrollando habilidades para el futuro alineadas con estándares reconocidos."}, "pedagogy": [{"k": {"en": "Play", "es": "Jugar"}, "c": "#68AE2F", "d": {"en": "Discover Threadbare and analyze how stories unfold.", "es": "Descubrir Threadbare y analizar cómo se despliegan las historias."}}, {"k": {"en": "Create", "es": "Crear"}, "c": "#0782CE", "d": {"en": "Build StoryQuests and assets: characters, narrative, mini-games.", "es": "Crear StoryQuests y assets: personajes, narrativa, minijuegos."}}, {"k": {"en": "Share", "es": "Compartir"}, "c": "#ED098F", "d": {"en": "Contribute to the open-source Threadbare repository.", "es": "Contribuir al repositorio de código abierto de Threadbare."}}, {"k": {"en": "Reflect", "es": "Reflexionar"}, "c": "#FFA60B", "d": {"en": "Iterate through peer and mentor feedback.", "es": "Iterar con la retroalimentación de pares y mentores."}}], "journey": [{"n": {"en": "Explore", "es": "Explore"}, "c": "#FF6B00", "d": {"en": "Play Threadbare, then build and submit your first game in short workshops.", "es": "Juega Threadbare y luego crea y envía tu primer juego en talleres cortos."}}, {"n": {"en": "Core", "es": "Core"}, "c": "#3B6FE0", "d": {"en": "Design and ship a full StoryQuest across a structured, multi-week program.", "es": "Diseña y publica un StoryQuest completo en un programa estructurado de varias semanas."}}, {"n": {"en": "More", "es": "More"}, "c": "#8A3FFC", "d": {"en": "Merge real work into the live, open-source product on GitHub.", "es": "Integra trabajo real en el producto vivo y de código abierto en GitHub."}}], "principles": [{"n": {"en": "Everyone Belongs", "es": "Todos pertenecen"}, "c": "#FF6B00", "d": {"en": "Every learner is welcome, and difference is a strength.", "es": "Cada estudiante es bienvenido y la diferencia es una fortaleza."}}, {"n": {"en": "Play Matters", "es": "El juego importa"}, "c": "#68AE2F", "d": {"en": "Play is where real learning and creativity begin.", "es": "El juego es donde comienzan el aprendizaje y la creatividad reales."}}, {"n": {"en": "Create for Impact", "es": "Crea con impacto"}, "c": "#0782CE", "d": {"en": "We make things that matter to real people.", "es": "Creamos cosas que importan a personas reales."}}, {"n": {"en": "Share Often, Be Open", "es": "Comparte a function anyFilter(){return !!(query.trim()||selProg.length||selDom.length||selBand.length)}
function matches(r){
  if(selProg.length&&!selProg.includes(r.program))return false;

function statusBadge(st){return st==='dev'?`<span class="status st-dev">${t('statusDev')}</span>`:`<span class="status st-live">${t('statusLive')}</span>`}
function glanceCard(g){const c=document.createElement('div');c.className='prog glance-only '+(g.name.startsWith('Explore')?'tier-explore':'tier-core');c.style.setProperty('--pc',g.c);
  const cred=`<div class="pcred"><div class="clab">${t('credLine')}</div><div class="cval">${credLine({mc:g.mc})}</div></div>`;
  c.innerHTML=`<div class="pname"><span class="pmark"></span>${ital(g.name)}</div>${statusBadge(g.status)}<div class="pdesc">${ital(g.desc[lang])}</div><div class="pmeta"><span>${t('age')} ${esc(g.age)}</span></div>${g.mc?cred:''}`;
  return c}
function progStrip(){const el=$('#progStrip');el.innerHTML='';PROGORDER.forEach(p=>{const P=D.programs[p],on=selProg.includes(p);const b=document.createElement('button');b.className='prog '+(p.startsWith('Explore')?'tier-explore':'tier-core');b.style.setProperty('--pc',PC[p]);b.setAttribute('aria-pressed',on);
  b.innerHTML=`<div class="pname"><span class="pmark"></span>${ital(p)}</div>${statusBadge(P.status)}<div class="pdesc">${ital(P.desc[lang])}</div><div class="pmeta"><span>${esc(P.sessions)}</span><span>${esc(P.hours)} ${t('hours')}</span><span>${t('age')} ${esc(P.age)}</span></div><div class="pcred"><div class="clab">${t('credLine')}</div><div class="cval">${credLine(P)}</div></div>`;
  b.onclick=()=>{const i=selProg.indexOf(p);if(i<0)selProg.push(p);else selProg.splice(i,1);render();$('#progTitle').scrollIntoView({behavior:'smooth',block:'start'})};el.appendChild(b);
  (D.glanceExtra||[]).filter(g=>g.after===p).forEach(g=>el.appendChild(glanceCard(g)))});
  (D.glanceExtra||[]).filter(g=>!PROGORDER.includes(g.after)).forEach(g=>el.appendChild(glanceCard(g)))}
function chipRow(host,defs,sel,onToggle,onAll,colorByProg){host.innerHTML='';
  const allc=document.createElement('button');allc.className='chip';allc.setAttribute('aria-pressed',sel.length===0);allc.textContent=t('all');allc.onclick=onAll;host.appendChild(allc);
  defs.forEach(([v,label])=>{const c=document.createElement('button');c.className='chip';c.setAttribute('aria-pressed',sel.includes(v));c.innerHTML=(colorByProg?`<span class="pmark" style="background:${PC[v]}"></span>`:'')+esc(label);c.onclick=()=>onToggle(v);host.appendChild(c)})}
function toggle(arr,v){const i=arr.indexOf(v);if(i<0)arr.push(v);else arr.splice(i,1);render()}
function buildFilters(){
  const progChips=[];PROGORDER.forEach(p=>{progChips.push([p,p]);(D.glanceExtra||[]).filter(g=>g.after===p&&g.mc).forEach(g=>progChips.push([g.name,g.name]))});
  $('#flabProg').textContent=t('filterProgram');chipRow($('#chipsProg'),progChips,selProg,v=>toggle(selProg,v),()=>{selProg=[];render()},true);
  $('#flabDom').textContent=t('filterDomain');chipRow($('#chipsDom'),DOMAINS.map(d=>[d,d]),selDom,v=>toggle(selDom,v),()=>{selDom=[];render()},false);

}

function facCert(){

function seqCount(s){const m=String(s).match(/^(\d+)\s*-\s*(\d+)$/);return m?(+m[2]-+m[1]+1):1}
function sessCount(rows){return rows.reduce((n,r)=>n+seqCount(r.seq),0)}
function seqNum(s){return parseInt(String(s))||0}
const PABBR={'Explore: Threadbare':'Explore: TB','Explore: Godot':'Explore: Godot','Core: Threadbare':'Core: TB','More: Threadbare':'More: TB'};
function stdIndex(){
  const fw=selFw.length?selFw:['ms','hs','gmd','iste_students','iste_ct'];
  const groups=[['ms',t('csta68')],['hs',t('csta912')],['gmd',t('gmd')],['iste_students',t('isteS')],['iste_ct',t('isteCT')]].filter(g=>fw.includes(g[0]));
  let html=`<p class="stdidx-intro">${t('stdIndexIntro')}</p>`;
  html+=`<div class="stdcorenote">${ital(t('stdCorePending'))}</div>`;
  let any=false;
  groups.forEach(([field,label])=>{
    const map={};
    D.rows.forEach(r=>splitc(r[field]).forEach(cd=>{(map[cd]=map[cd]||[]).push(r)}));
    const codes=Object.keys(map).sort();
    if(!codes.length)return;
    any=true;
    html+=`<div class="stdidx-group"><div class="flabel stdidx-h">${label}</div>`;
    codes.forEach(cd=>{
      const rs=map[cd].slice().sort((a,b)=>PROGORDER.indexOf(a.program)-PROGORDER.indexOf(b.program)||seqNum(a.seq)-seqNum(b.seq));
      const chips=rs.map(r=>`<span class="sesschip" style="--pc:${PC[r.program]}" title="${esc(r.program)} — ${esc((r[lang]||{}).session||'')}">${ital(PABBR[r.program])} ${esc(r.seq)}</span>`).join('');
      const st=stmt(cd);
      html+=`<div class="stdidx-row"><div class="stdidx-code">${esc(cd)}</div><div class="stdidx-body">${st?`<div class="stdidx-stmt">${esc(st)}</div>`:''}<div class="stdidx-sess">${chips}</div></div></div>`;
    });
    html+=`</div>`;
  });
  if(!any)html+=`<div class="nomatch">${t('noMatch')}</div>`;
  return html;
}
const XPLVL={'Minimal':'50 XP','Moderate':'75 XP','Extensive':'100 XP'};
function xpForLevel(v){if(!v)return v;if(v==='n/a')return 'n/a';if(/^Mixed/i.test(v)){const parts=v.replace(/^Mixed:?/i,'').split('/').map(s=>s.trim()).filter(Boolean);return 'Mixed: '+parts.map(pp=>XPLVL[pp]||pp).join(' / ');}return XPLVL[v]||v}
function stdItems(codes){return codes.map(c=>`<div class="stditem"><span class="code">${c}</span><span class="stmt">${esc(stmt(c)||'')}</span></div>`).join('')}
function card(r){

  if(xpShow)pills.push(`<span class="pill pill-xp">${t('xp')} ${esc(r.xp)}</span>`);
  if(/^yes/i.test(r.ai))pills.push(`<span class="pill pill-ai">✦ ${t('ai')}</span>`);
  const skills=Object.entries(r.skills||{}).map(([k,v])=>`<span class="sk">${esc(k)}: <b>${esc(xpForLevel(v))}</b></span>`).join('');
  const hasSkills=Object.values(r.skills||{}).some(v=>v&&String(v).toLowerCase()!=='n/a');
  const istS=splitc(r.iste_students).map(x=>`<span class="tag-iste">ISTE ${esc(x)}</span>`).join('');
  const istCT=splitc(r.iste_ct).map(x=>`<span class="tag-iste">${esc(x)}</span>`).join('');
  const prac=splitc(r.practices).map(x=>`<span class="tag-iste" title="${esc(stmt(x)||'')}">${esc(x)}</span>`).join('');
  const ms=splitc(r.ms),hs=splitc(r.hs),gmd=splitc(r.gmd);let sd='';
  if(ms.length)sd+=`<div class="field"><div class="flabel">${t('csta68')}</div><div class="stdlist">${stdItems(ms)}</div></div>`;
  if(hs.length)sd+=`<div class="field"><div class="flabel">${t('csta912')}</div><div class="stdlist">${stdItems(hs)}</div></div>`;
  if(gmd.length)sd+=`<div class="field"><div class="flabel">${t('gmd')}</div><div class="stdlist">${stdItems(gmd)}</div></div>`;
  const xpDetail=(!r.xp||xpShow)?'':`<div class="field" style="margin-top:14px"><div class="flabel">${t('xp')}</div><div class="fval">${esc(r.xp)}</div></div>`;
  const skillsField=hasSkills?`<div class="field" style="margin-top:14px"><div class="flabel">${t('skills')}</div><div class="skillrow">${skills}</div></div>`:'';
  const hasStd=ms.length||hs.length||gmd.length||istS||istCT||prac||(r.concept&&r.concept.trim());
  const stdBlock=hasStd?`<div class="stdblock"><div class="flabel">${t('standards')}</div><div class="stdnote">${t('stdEnNote')}</div><div class="dgrid">${sd}</div>
      <div class="dgrid" style="margin-top:14px"><div class="field"><div class="flabel">${t('concept')}</div><div class="fval">${esc(r.concept)}${r.sub?' - '+esc(r.sub):''}</div><div class="stdrow2" style="margin-top:8px">${prac}</div></div>
      <div class="field"><div class="flabel">${t('isteS')}</div><div class="stdrow2">${istS}</div><div class="flabel" style="margin-top:12px">${t('isteCT')}</div><div class="stdrow2">${istCT}</div></div></div></div>`:'';
  const devTag=(!hasStd&&!r.xp)?`<div class="stdnote" style="margin-top:14px;font-style:italic">${t('stdPending')}</div>`:'';
  return `<details class="card"><summary><div class="chead"><div class="snum">${esc(r.seq)}</div><div class="sbody">
    <div class="stitle">${tt}</div><div class="sdriving">${ital(c.driving)}</div><div class="smeta">${pills.join('')}</div>
    </div><svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg></div></summary>
    <div class="detail"><div class="dgrid">
      <div class="field"><div class="flabel">${t('taught')}</div><div class="fval">${ital(c.taught)}</div></div>
      <div><div class="field"><div class="flabel">${t('deliverable')}</div><div class="fval">${ital(c.deliverable)}</div></div>
      <div class="field" style="margin-top:14px"><div class="flabel">${t('tools')}</div><div class="fval">${ital(c.tools)}</div></div>${xpDetail}
      ${skillsField}</div></div>
    ${stdBlock}${devTag}</div></details>`;
}
function cardsHtml(rs){
  const M=D.coreMilestones;
  if(!M||!rs.some(r=>r.milestone))return rs.map(card).join('');
  let html='',cur=null;
  rs.forEach(r=>{
    if(r.milestone!==cur){cur=r.milestone;const mt=(M[cur]&&M[cur][lang])||('Milestone '+cur);html+=`<div class="msgroup">${esc(mt)}</div>`;}
    html+=card(r);
  });
  return html;
}
